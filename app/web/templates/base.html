<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}BUSCA FRETE{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <script defer src="{{ url_for('static', filename='app.js') }}"></script>
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div>
          <a class="brand" href="{{ url_for('index') }}">
            <span class="logo-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4.5 6.5h10.8c1.3 0 2.4 1 2.6 2.3l1.1 8.1c.2 1.7-1.1 3.1-2.8 3.1H7.7c-1.4 0-2.6-1.1-2.8-2.5L3.7 8.6C3.4 7.5 3.8 6.5 4.5 6.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M8 6.5l1.1-2.1C9.5 3.6 10.2 3 11.1 3h2.7c.9 0 1.7.6 2 1.4l.7 2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M8.5 12.3h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </span>
            BUSCA FRETE
          </a>
          <div class="subtitle">Consulte o frete por link do produto e CEP.</div>
        </div>
        <div class="header-actions">
          <button type="button" class="chip theme-toggle" data-theme-toggle aria-label="Alternar tema">
            <span class="theme-toggle-icon" data-theme-icon-light aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            <span class="theme-toggle-icon" data-theme-icon-dark aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            </span>
          </button>
          <a class="chip" href="{{ url_for('manual') }}">manual</a>
          <a class="chip" href="{{ url_for('index') }}#scheduler">agendamentos</a>
          <a class="chip" href="{{ url_for('results_center') }}">resultados</a>
          <a class="chip" href="{{ url_for('health') }}" target="_blank" rel="noreferrer">status</a>
        </div>
      </header>

      {% block content %}{% endblock %}
    </div>
  </body>
</html>
